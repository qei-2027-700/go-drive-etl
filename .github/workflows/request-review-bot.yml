name: Triage PR review with Jev

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: jev-review-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# contents: read is only used to load the reviewed revision's local script.
# The remaining permissions are needed to update the PR comment and review.
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  triage-review:
    name: Triage PR review with Jev
    # Fork PRs do not receive repository secrets and are outside this workflow's scope.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
      # Fractional value (80%), configurable without modifying the script.
      JEV_APPROVAL_CONFIDENCE_THRESHOLD: "0.8"
      JEV_MAX_DIFF_CHARACTERS: "100000"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Evaluate filtered PR diff and update triage
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const triage = require('./.github/scripts/jev-review-triage.js');
            await triage({ github, context, core });
