name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint-and-security:
    name: Lint & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt が適用されていないファイルがあります:"
            echo "$unformatted"
            echo "ローカルで 'gofmt -w .' を実行してください。"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: govulncheck
        run: govulncheck ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: go test with coverage
        run: |
          go test -cover ./... | tee coverage.txt
          {
            echo "## Test coverage"
            echo "\`\`\`text"
            cat coverage.txt
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    services:
      firestore:
        image: 178inaba/firestore-emulator@sha256:7049209f1ff1f2a782d0047884be161ddca053d6b2615d160fd27755ca4aad82
        env:
          DATABASE_MODE: firestore-native
        ports:
          - 8080:8080
        options: >-
          --health-cmd "curl -f http://localhost:8080"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      FIRESTORE_EMULATOR_HOST: localhost:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run integration tests
        run: go test -tags=integration ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: go build
        run: go build ./...
